name: Parser Formal F5 (Surface Syntax Gate)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/proposals/**'
      - 'docs/specs/TEMPLATE.md'
      - 'docs/specs/active/**'
      - 'scripts/check_syntax_gate.py'
      - 'scripts/tests/test_check_syntax_gate.py'
      - '.github/workflows/parser-formal-f5.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/proposals/**'
      - 'docs/specs/TEMPLATE.md'
      - 'docs/specs/active/**'
      - 'scripts/check_syntax_gate.py'
      - 'scripts/tests/test_check_syntax_gate.py'
      - '.github/workflows/parser-formal-f5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f5-syntax-gate:
    name: F5 Surface Syntax Gate (Template, Unit Tests & Changed Proposals/Specs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify F5 template integrity and unit tests
        run: |
          python3 scripts/check_syntax_gate.py --self-check-template
          python3 -m unittest discover -s scripts/tests -p 'test_check_syntax_gate.py' -v
      - name: Check changed proposals and active specs on pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_docs < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- \
              'docs/proposals/*.md' 'docs/proposals/**/*.md' 'docs/specs/active/*.md'
          )
          if [ "${#changed_docs[@]}" -eq 0 ]; then
            echo "no changed proposal or active spec Markdown files to check"
            exit 0
          fi
          args=()
          for path in "${changed_docs[@]}"; do
            if [ -f "$path" ]; then
              args+=(--check-file "$path")
            fi
          done
          if [ "${#args[@]}" -gt 0 ]; then
            python3 scripts/check_syntax_gate.py "${args[@]}"
          fi
