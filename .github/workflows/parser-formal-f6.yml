              if m_none:
                  seen.add(m_none.group(1))
                  continue
              m_deps = re.fullmatch(r"'([^']+)' depends on axioms: \[([^\]]*)\]", line)
              if m_deps:
                  thm = m_deps.group(1)
                  deps = {a.strip() for a in m_deps.group(2).split(",") if a.strip()}
                  bad = deps - allowed
                  if bad:
                      sys.exit(f"error: theorem {thm} depends on disallowed axioms: {sorted(bad)}")
                  seen.add(thm)
                  continue
              sys.exit(f"error: unexpected #print axioms output line: {line}")

          missing = expected - seen
          if missing:
              sys.exit(f"error: missing axiom reports for: {sorted(missing)}")
          print("all 5 F6GroupOwners theorems depend only on allowed core Lean axioms")
          PY
      - name: Build F6AdjacentPoison with warnings as errors
        working-directory: formal/parser/f6_adjacent_poison
        run: |
          lake build
          lake env lean -DwarningAsError=true F6AdjacentPoison.lean
      - name: Verify F6AdjacentPoison theorem axiom dependencies
        working-directory: formal/parser/f6_adjacent_poison
        run: |
          set -euo pipefail
          axioms_out="$(lake env lean --stdin <<'EOF'
          import F6AdjacentPoison
          #print axioms F6AdjacentPoison.scanElse_bounds
          #print axioms F6AdjacentPoison.elsePoisonCache_sound
          #print axioms F6AdjacentPoison.scanElse_foundElse_is_else
          #print axioms F6AdjacentPoison.scanAdjacentTail_never_same_line_brace
          EOF
          )"
          printf '%s\n' "$axioms_out"
          python3 - "$axioms_out" <<'PY'
