name: Parser Formal F6 (Lean 4 + Kani)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'formal/parser/f6_angle_groups/**'
      - 'crates/lang-frontend/src/parser/engine/recovery.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_groups.rs'
      - '.github/workflows/parser-formal-f6.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/parser/f6_angle_groups/**'
      - 'crates/lang-frontend/src/parser/engine/recovery.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_groups.rs'
      - '.github/workflows/parser-formal-f6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean4-model-proof:
    name: F6 Lean 4 Model Proof (unbounded P1-P4)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache elan and Lean 4 toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/parser/f6_angle_groups/.lake
          key: f6-lean4-${{ hashFiles('formal/parser/f6_angle_groups/lean-toolchain') }}
      - name: Install elan if missing
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean 4 proof library with warnings as errors
        working-directory: formal/parser/f6_angle_groups
        run: |
          lake build
          lake env lean -DwarningAsError=true F6AngleGroups.lean
      - name: Verify theorem axiom dependencies (only core Lean axioms)
        working-directory: formal/parser/f6_angle_groups
        run: |
          set -euo pipefail
          axioms_out="$(lake env lean --stdin <<'EOF'
          import F6AngleGroups
          #print axioms F6AngleGroups.dpBoundary_eq_forwardStop
          #print axioms F6AngleGroups.dpMatch_eq_forwardMatch
          #print axioms F6AngleGroups.dpMatch_eq_ordinaryVisitMatch
          #print axioms F6AngleGroups.dpMatch_some_pos
          EOF
          )"
          printf '%s\n' "$axioms_out"
          python3 - "$axioms_out" <<'PY'
          import re, sys

          expected = {
              "F6AngleGroups.dpBoundary_eq_forwardStop",
              "F6AngleGroups.dpMatch_eq_forwardMatch",
              "F6AngleGroups.dpMatch_eq_ordinaryVisitMatch",
              "F6AngleGroups.dpMatch_some_pos",
          }
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          seen = set()

          for raw_line in sys.argv[1].splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              m_none = re.fullmatch(r"'([^']+)' does not depend on any axioms", line)
              if m_none:
                  seen.add(m_none.group(1))
                  continue
              m_deps = re.fullmatch(r"'([^']+)' depends on axioms: \[([^\]]*)\]", line)
              if m_deps:
                  thm = m_deps.group(1)
                  deps = {a.strip() for a in m_deps.group(2).split(",") if a.strip()}
                  bad = deps - allowed
                  if bad:
                      sys.exit(f"error: theorem {thm} depends on disallowed axioms: {sorted(bad)}")
                  seen.add(thm)
                  continue
              sys.exit(f"error: unexpected #print axioms output line: {line}")

          missing = expected - seen
          if missing:
              sys.exit(f"error: missing axiom reports for: {sorted(missing)}")
          print("all 4 theorems depend only on allowed core Lean axioms")
          PY

  kani-bounded-rust:
    name: F6 Kani Bounded Rust Proof (sharded n <= 3 equiv + n = 4 P4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Cache Kani 0.68.0 installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: f6-kani-0.68.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Kani 0.68.0 and matching nightly toolchain if missing
        run: |
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier --version 0.68.0
          fi
          if [ ! -x "$HOME/.kani/kani-0.68.0/toolchain/bin/rustc" ]; then
            cargo kani setup
          fi
      - name: Run bounded angle-group Kani harnesses
        run: |
          cargo kani -p lang-frontend --lib \
            --harness verify_angle_group_closers_equivalence_len_0 \
            --harness verify_angle_group_closers_equivalence_len_1 \
            --harness verify_angle_group_closers_equivalence_len_2 \
            --harness verify_angle_group_closers_equivalence_len_3_dense \
            --harness verify_angle_group_closers_equivalence_len_3_sparse \
            --harness verify_angle_group_closer_strictly_after_opener_and_nonzero_len_4
