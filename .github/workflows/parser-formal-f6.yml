  kani-bounded-rust:
    name: F6 Kani Bounded Rust Proofs (angle_groups, ordinary_groups, group_owners, adjacent_poison & pratt)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Cache Kani 0.68.0 installation
        uses: actions/cache@v6
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: f6-kani-0.68.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Kani 0.68.0 and matching nightly toolchain if missing
        run: |
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier --version 0.68.0
          fi
          if [ ! -x "$HOME/.kani/kani-0.68.0/toolchain/bin/rustc" ]; then
            cargo kani setup
          fi
      - name: Run bounded F6 Kani harnesses
        run: |
          cargo kani -p lang-frontend --lib \
            --harness verify_angle_group_closers_equivalence_len_0 \
            --harness verify_angle_group_closers_equivalence_len_1 \
            --harness verify_angle_group_closers_equivalence_len_2 \
            --harness verify_angle_group_closers_equivalence_len_3_dense \
            --harness verify_angle_group_closers_equivalence_len_3_sparse \
            --harness verify_angle_group_closer_strictly_after_opener_and_nonzero_len_4 \
            --harness verify_recovery_boundaries_monoid_and_non_shielding \
            --harness verify_ordinary_groups_active_invariant_len_1 \
            --harness verify_ordinary_groups_active_invariant_len_2 \
            --harness verify_confirmed_closer_monotonicity_and_safety \
            --harness verify_group_owners_depth_and_filtering_len_4 \
            --harness verify_else_poison_cache_soundness_len_6 \
            --harness verify_infix_rule_table_invariants \
            --harness verify_pratt_precedence_and_non_assoc_3_ops
