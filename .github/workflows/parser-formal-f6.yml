name: Parser Formal F6 (Lean 4 + Kani)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'formal/parser/f6_angle_groups/**'
      - 'formal/parser/f6_ordinary_groups/**'
      - 'formal/parser/f6_group_owners/**'
      - 'formal/parser/f6_adjacent_poison/**'
      - 'formal/parser/f6_pratt_precedence/**'
      - 'crates/lang-frontend/src/parser/engine.rs'
      - 'crates/lang-frontend/src/parser/engine/operator.rs'
      - 'crates/lang-frontend/src/parser/engine/pratt_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/group_owner_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/adjacent_poison.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/adjacent_poison_kani.rs'
      - '.github/workflows/parser-formal-f6.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/parser/f6_angle_groups/**'
      - 'formal/parser/f6_ordinary_groups/**'
      - 'formal/parser/f6_group_owners/**'
      - 'formal/parser/f6_adjacent_poison/**'
      - 'formal/parser/f6_pratt_precedence/**'
      - 'crates/lang-frontend/src/parser/engine.rs'
      - 'crates/lang-frontend/src/parser/engine/operator.rs'
      - 'crates/lang-frontend/src/parser/engine/pratt_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/group_owner_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/adjacent_poison.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/adjacent_poison_kani.rs'
      - '.github/workflows/parser-formal-f6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean4-model-proof:
    name: F6 Lean 4 Model Proofs (unbounded P1-P4, O1-O5, G1-G4, E1-E4 & PR1-PR6)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache elan and Lean 4 toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            formal/parser/f6_angle_groups/.lake
            formal/parser/f6_ordinary_groups/.lake
            formal/parser/f6_group_owners/.lake
            formal/parser/f6_adjacent_poison/.lake
            formal/parser/f6_pratt_precedence/.lake
          key: f6-lean4-${{ hashFiles('formal/parser/f6_angle_groups/lean-toolchain', 'formal/parser/f6_ordinary_groups/lean-toolchain', 'formal/parser/f6_group_owners/lean-toolchain', 'formal/parser/f6_adjacent_poison/lean-toolchain', 'formal/parser/f6_pratt_precedence/lean-toolchain') }}
      - name: Install elan if missing
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build F6AngleGroups with warnings as errors
        working-directory: formal/parser/f6_angle_groups
        run: |
          lake build
          lake env lean -DwarningAsError=true F6AngleGroups.lean
      - name: Verify F6AngleGroups theorem axiom dependencies
        working-directory: formal/parser/f6_angle_groups
        run: |
          set -euo pipefail
          axioms_out="$(lake env lean --stdin <<'EOF'
          import F6AngleGroups
          #print axioms F6AngleGroups.dpBoundary_eq_forwardStop
          #print axioms F6AngleGroups.dpMatch_eq_forwardMatch
          #print axioms F6AngleGroups.dpMatch_eq_ordinaryVisitMatch
          #print axioms F6AngleGroups.dpMatch_some_pos
          EOF
          )"
          printf '%s\n' "$axioms_out"
          python3 - "$axioms_out" <<'PY'
          import re, sys

          expected = {
              "F6AngleGroups.dpBoundary_eq_forwardStop",
              "F6AngleGroups.dpMatch_eq_forwardMatch",
              "F6AngleGroups.dpMatch_eq_ordinaryVisitMatch",
              "F6AngleGroups.dpMatch_some_pos",
          }
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          seen = set()

          for raw_line in sys.argv[1].splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              m_none = re.fullmatch(r"'([^']+)' does not depend on any axioms", line)
              if m_none:
                  seen.add(m_none.group(1))
                  continue
              m_deps = re.fullmatch(r"'([^']+)' depends on axioms: \[([^\]]*)\]", line)
              if m_deps:
                  thm = m_deps.group(1)
                  deps = {a.strip() for a in m_deps.group(2).split(",") if a.strip()}
                  bad = deps - allowed
                  if bad:
                      sys.exit(f"error: theorem {thm} depends on disallowed axioms: {sorted(bad)}")
                  seen.add(thm)
                  continue
              sys.exit(f"error: unexpected #print axioms output line: {line}")

          missing = expected - seen
          if missing:
              sys.exit(f"error: missing axiom reports for: {sorted(missing)}")
          print("all 4 F6AngleGroups theorems depend only on allowed core Lean axioms")
          PY
      - name: Build F6OrdinaryGroups with warnings as errors
        working-directory: formal/parser/f6_ordinary_groups
        run: |
          lake build
          lake env lean -DwarningAsError=true F6OrdinaryGroups.lean
