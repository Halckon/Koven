name: Parser Formal F6 (Lean 4 + Kani)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'formal/parser/f6_angle_groups/**'
      - 'crates/lang-frontend/src/parser/engine/recovery.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_groups.rs'
      - '.github/workflows/parser-formal-f6.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/parser/f6_angle_groups/**'
      - 'crates/lang-frontend/src/parser/engine/recovery.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_groups.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/angle_group_kani.rs'
      - 'crates/lang-frontend/src/parser/engine/recovery/ordinary_groups.rs'
      - '.github/workflows/parser-formal-f6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean4-model-proof:
    name: F6 Lean 4 Model Proof (unbounded P1-P4)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache elan and Lean 4 toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/parser/f6_angle_groups/.lake
          key: f6-lean4-${{ hashFiles('formal/parser/f6_angle_groups/lean-toolchain') }}
      - name: Install elan if missing
        run: |
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify zero sorry or axiom escapes
        working-directory: formal/parser/f6_angle_groups
        run: |
          ! grep -rnE '\b(sorry|axiom)\b' F6AngleGroups.lean
      - name: Build Lean 4 proof library
        working-directory: formal/parser/f6_angle_groups
        run: lake build

  kani-bounded-rust:
    name: F6 Kani Bounded Rust Proof (n <= 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Cache Kani installation
        uses: actions/cache@v4
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: f6-kani-0.61.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Kani if missing
        run: |
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier --version 0.61.0
            cargo kani setup
          fi
      - name: Run bounded angle-group Kani harnesses
        run: |
          cargo kani -p lang-frontend --lib \
            --harness verify_angle_group_closers_equivalence_bounded \
            --harness verify_angle_group_closer_strictly_after_opener_and_nonzero
