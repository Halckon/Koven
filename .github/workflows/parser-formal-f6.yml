  kani-bounded-rust:
    name: F6 Kani Bounded Rust Proofs (all 18 F6 slices, 47 harnesses)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Cache Kani 0.68.0 installation
        uses: actions/cache@v6
        with:
          path: |
            ~/.kani
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: f6-kani-0.68.0-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Kani 0.68.0 and matching nightly toolchain if missing
        run: |
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier --version 0.68.0
          fi
          if [ ! -x "$HOME/.kani/kani-0.68.0/toolchain/bin/rustc" ]; then
            cargo kani setup
          fi
      - name: Run bounded F6 Kani harnesses
        run: |
          cargo kani -p lang-frontend --lib \
            --harness verify_angle_group_closers_equivalence_len_0 \
            --harness verify_angle_group_closers_equivalence_len_1 \
            --harness verify_angle_group_closers_equivalence_len_2 \
            --harness verify_angle_group_closers_equivalence_len_3_dense \
            --harness verify_angle_group_closers_equivalence_len_3_sparse \
            --harness verify_angle_group_closer_strictly_after_opener_and_nonzero_len_4 \
            --harness verify_recovery_boundaries_monoid_and_non_shielding \
            --harness verify_ordinary_groups_active_invariant_len_1 \
            --harness verify_ordinary_groups_active_invariant_len_2 \
            --harness verify_confirmed_closer_monotonicity_and_safety \
            --harness verify_group_owners_depth_and_filtering_len_4 \
            --harness verify_else_poison_cache_soundness_len_6 \
            --harness verify_infix_rule_table_invariants \
            --harness verify_pratt_precedence_and_non_assoc_3_ops \
            --harness verify_stops_hard_delimiter_non_shielding \
            --harness verify_type_stops_recovery_projections \
            --harness verify_lambda_trial_left_brace_always_fails_active \
            --harness verify_lambda_trial_single_pass_eq_spec_len_5 \
            --harness verify_validate_lexeme_stream_rejects_empty_and_missing_eof \
            --harness verify_validate_lexeme_stream_partition_len_4 \
            --harness verify_diagnostic_anchor_prefix_empty_and_oob \
            --harness verify_diagnostic_anchor_prefix_exact_range_len_8 \
            --harness verify_raw_to_significant_exact_and_monotone_len_8 \
            --harness verify_trial_path_ends_and_budget_len_8 \
            --harness verify_owner_events_soundness_monotonicity_and_group_owners_bridge \
            --harness verify_owner_events_rejects_unclosed_and_unconsumed \
            --harness verify_when_boundary_new_selector_and_control \
            --harness verify_when_boundary_step_invariants \
            --harness verify_when_boundary_run_events_balance_len_6 \
            --harness verify_supertype_direct_boundary_and_lambda_token_classification \
            --harness verify_supertype_deinit_and_suffix_stop_decisions \
            --harness verify_delegation_lambda_tail_run_len_6 \
            --harness verify_block_unsupported_line_break_and_explicit_start \
            --harness verify_block_element_separator_required_matrix \
            --harness verify_missing_block_root_end_run_len_6 \
            --harness verify_postfix_start_typed_call_and_trailing_lambda \
            --harness verify_call_argument_boundary_and_callee_disjointness \
            --harness verify_recovery_callee_end_reverse_scan_len_6 \
            --harness verify_file_header_and_root_separator_decisions \
            --harness verify_declaration_modifier_step_invariants \
            --harness verify_declaration_modifier_run_len_6 \
            --harness verify_destructuring_start_predicates \
            --harness verify_destructuring_exit_and_initializer_guards \
            --harness verify_destructuring_loop_state_invariant_len_6 \
            --harness verify_type_ref_start_extension_and_closer_guards \
            --harness verify_bounded_proven_parameter_closer_invariants \
            --harness verify_string_type_poison_scan_len_6
