              "F6OrdinaryGroups.includeUnclosed_preserves_child_block",
              "F6OrdinaryGroups.includeUnclosed_preserves_child_sep",
              "F6OrdinaryGroups.popUntil_complete_and_wf",
              "F6OrdinaryGroups.visitGroup_preserves_wf",
              "F6OrdinaryGroups.visitGroup_close_matches_iff",
              "F6OrdinaryGroups.runEvents_preserves_wf",
              "F6OrdinaryGroups.confirmedCloser_antitone_stops",
              "F6OrdinaryGroups.confirmedCloser_monotone_cursor",
              "F6OrdinaryGroups.confirmedCloser_boundary_safety",
          }
          allowed = {"propext", "Quot.sound", "Classical.choice"}
          seen = set()

          for raw_line in sys.argv[1].splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              m_none = re.fullmatch(r"'([^']+)' does not depend on any axioms", line)
              if m_none:
                  seen.add(m_none.group(1))
                  continue
              m_deps = re.fullmatch(r"'([^']+)' depends on axioms: \[([^\]]*)\]", line)
              if m_deps:
                  thm = m_deps.group(1)
                  deps = {a.strip() for a in m_deps.group(2).split(",") if a.strip()}
                  bad = deps - allowed
                  if bad:
                      sys.exit(f"error: theorem {thm} depends on disallowed axioms: {sorted(bad)}")
                  seen.add(thm)
                  continue
              sys.exit(f"error: unexpected #print axioms output line: {line}")

          missing = expected - seen
          if missing:
              sys.exit(f"error: missing axiom reports for: {sorted(missing)}")
          print("all 14 F6OrdinaryGroups theorems depend only on allowed core Lean axioms")
          PY
      - name: Build F6GroupOwners with warnings as errors
        working-directory: formal/parser/f6_group_owners
        run: |
          lake build
          lake env lean -DwarningAsError=true F6GroupOwners.lean
      - name: Verify F6GroupOwners theorem axiom dependencies
        working-directory: formal/parser/f6_group_owners
