name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changed Files
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      editors: ${{ steps.filter.outputs.editors }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
      preview: ${{ steps.filter.outputs.preview }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'scripts/**'
              - '*.md'
              - 'LICENSE*'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-llvm/**'
            rust:
              - 'crates/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-llvm/**'
              - 'editors/**'
              - 'docs/tutorials/**'
              - 'scripts/check_tutorial.py'
              - 'scripts/check_word_frequency.py'
              - 'scripts/tests/test_word_frequency_contracts.py'
              - 'scripts/check_core.sh'
              - 'scripts/check_integration.sh'
              - 'scripts/check_stage_integration.sh'
              - 'scripts/check_guide_litmus.sh'
              - 'scripts/install_ci_llvm.sh'
              - 'scripts/check_ci_results.py'
              - 'scripts/check_native_sanitizers.py'
              - 'scripts/native_lsan_entry.c'
              - 'scripts/tests/test_check_native_sanitizers.py'
              - 'scripts/rust_test_artifact.rs'
              - 'scripts/tests/test_check_ci_results.py'
              - 'docs/guide/10-ownership-borrowing-drop.md'
              - 'docs/guide/11-copyability-layout-construction.md'
              - 'docs/guide/13-program-runtime-standard-library.md'
              - 'docs/guide/15-conformance-and-staging.md'
            editors:
              - 'editors/**'
              - '.github/workflows/ci.yml'
              - 'scripts/check_ci_results.py'
              - 'scripts/tests/test_check_ci_results.py'
              - 'docs/guide/01-lexical.md'
              - 'docs/guide/07-calls-lambdas-closures.md'
            preview:
              - 'crates/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-llvm/**'
              - 'docs/tutorials/**'
              - 'scripts/check_tutorial.py'
              - 'scripts/package_preview.py'
              - 'scripts/preview_host.py'
              - 'scripts/check_preview_install.py'
              - 'scripts/install_preview_dependencies.sh'
              - 'scripts/install_ci_llvm.sh'
              - 'scripts/tests/test_preview_*.py'
              - 'scripts/tests/test_tutorial_contracts.py'
              - 'scripts/check_ci_results.py'
              - 'scripts/tests/test_check_ci_results.py'
              - 'LICENSE*'
              - 'docs/development/preview-candidate.md'
            frontend:
              - 'crates/lang-frontend/**'
              - 'crates/lang-std/**'
            codegen:
              - 'crates/lang-codegen/**'

  rust-size:
    name: Rust Physical Line Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Inspect the exact PR head, not GitHub's synthetic merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test Rust size policy
        run: python3 -m unittest discover -s scripts/tests -p test_check_rust_sizes.py -v
      - name: Check handwritten Rust size growth
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base=origin/main; fi
          # Full history normally has the base; a force-push may need its exact SHA.
          if ! git cat-file -e "$base^{commit}"; then git fetch --no-tags origin "$base"; fi
          python3 scripts/check_rust_sizes.py --base "$base"

  dependencies:
    name: Direct Workspace Dependency Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Verify direct workspace declarations
        run: python3 scripts/check_workspace_dependencies.py


  docs:
    name: Docs & Spec Structural Gate
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run check_docs.py
        run: python3 scripts/check_docs.py
      - name: Test docs and CI gate policies
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check git diff whitespace
        run: git diff --check

  editors:
    name: Tree-sitter CLI Corpus
    needs: changes
    if: needs.changes.outputs.editors == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked Tree-sitter CLI
        run: npm ci --prefix editors/tree-sitter
      - name: Check generated parser and actual corpus
        run: |
          npm run generate --prefix editors/tree-sitter
          git diff --exit-code -- editors/tree-sitter/src
          npm test --prefix editors/tree-sitter

  fmt:
    name: Rust Code Formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.preview == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Workspace Check & Clippy (${{ matrix.os }})
    needs: [changes, docs, fmt]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.preview == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (needs.docs.result == 'success' || needs.docs.result == 'skipped') &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM 21
        id: llvm
        uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ runner.arch }}-rust-1.96.0-llvm-${{ steps.llvm.outputs.version }}-${{ hashFiles('Cargo.lock', 'scripts/install_ci_llvm.sh', '.github/actions/setup-llvm/action.yml') }}
      - name: Cargo Check
        run: cargo check --locked --workspace --all-targets
      - name: Cargo Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Targeted Tests (${{ matrix.os }})
    needs: [changes, clippy]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.preview == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.clippy.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM 21
        id: llvm
        uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ runner.arch }}-rust-1.96.0-llvm-${{ steps.llvm.outputs.version }}-${{ hashFiles('Cargo.lock', 'scripts/install_ci_llvm.sh', '.github/actions/setup-llvm/action.yml') }}
      - name: Run bounded composition including tutorial
        run: bash scripts/check_integration.sh
      - name: Word frequency byte and boundary contracts
        run: python3 scripts/check_word_frequency.py --evidence "$RUNNER_TEMP/koven-word-frequency"
      - name: Preserve word frequency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: word-frequency-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/koven-word-frequency
          if-no-files-found: error
      - name: Linux native sanitizer contracts
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: python3 scripts/check_native_sanitizers.py --linux --artifacts "$RUNNER_TEMP/koven-sanitizers"
      - name: Preserve Linux sanitizer evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: native-sanitizers-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/koven-sanitizers
          if-no-files-found: error

  preview-macos-produce:
    name: Preview Producer (macos-14)
    needs: [changes, test]
    if: |
      always() && needs.test.result == 'success' &&
      (needs.changes.outputs.preview == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Install matching standard library copyright materials
        run: rustup component add rust-docs
      - name: Build source-traceable release candidate
        run: python3 scripts/package_preview.py --output "$RUNNER_TEMP/preview-producer"
      - name: Upload this run's candidate and bootstrap
        id: candidate
        uses: actions/upload-artifact@v7
        with:
          name: preview-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-producer/*.tar.gz
            ${{ runner.temp }}/preview-producer/*.sha256
            ${{ runner.temp }}/preview-producer/check_preview_install.py
          if-no-files-found: error
      - name: Preserve producer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-macos-producer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-producer/evidence
            ${{ runner.temp }}/preview-producer/producer-results.json
          if-no-files-found: error

  preview-macos-consume:
    name: Preview Independent Consumer (macos-14)
    needs: preview-macos-produce
    if: always() && needs.preview-macos-produce.result == 'success'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require the matching producer artifact ID
        shell: bash
        env:
          PREVIEW_ARTIFACT_ID: ${{ needs.preview-macos-produce.outputs.artifact-id }}
        run: '[[ "$PREVIEW_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.preview-macos-produce.outputs.artifact-id }}
          path: ${{ runner.temp }}/preview-download
      - name: Install and run only the matching package
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/preview-download/check_preview_install.py" \
            --archive "$RUNNER_TEMP/preview-download/"*.tar.gz \
            --sha256 "$RUNNER_TEMP/preview-download/"*.sha256 \
            --evidence "$RUNNER_TEMP/preview-consumer-evidence" \
            --work-parent "$RUNNER_TEMP" --prepare-dependencies
      - name: Preserve installation and command evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-macos-consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-consumer-evidence
          if-no-files-found: error

  preview-linux-produce:
    name: Preview Producer (ubuntu-24.04)
    needs: [changes, test]
    if: |
      always() && needs.test.result == 'success' &&
      (needs.changes.outputs.preview == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # setup-python injects LD_LIBRARY_PATH on Linux; inspect the ordinary loader.
      - name: Verify Ubuntu system Python
        run: /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Install matching standard library copyright materials
        run: rustup component add rust-docs
      - name: Build source-traceable release candidate
        run: /usr/bin/python3 scripts/package_preview.py --output "$RUNNER_TEMP/preview-producer"
      - name: Upload this run's candidate and bootstrap
        id: candidate
        uses: actions/upload-artifact@v7
        with:
          name: preview-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-producer/*.tar.gz
            ${{ runner.temp }}/preview-producer/*.sha256
            ${{ runner.temp }}/preview-producer/check_preview_install.py
          if-no-files-found: error
      - name: Preserve producer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-linux-producer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-producer/evidence
            ${{ runner.temp }}/preview-producer/producer-results.json
          if-no-files-found: error

  preview-linux-consume:
    name: Preview Independent Consumer (ubuntu-24.04)
    needs: preview-linux-produce
    if: always() && needs.preview-linux-produce.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # setup-python injects LD_LIBRARY_PATH on Linux; inspect the ordinary loader.
      - name: Verify Ubuntu system Python
        run: /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
      - name: Require the matching producer artifact ID
        shell: bash
        env:
          PREVIEW_ARTIFACT_ID: ${{ needs.preview-linux-produce.outputs.artifact-id }}
        run: '[[ "$PREVIEW_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.preview-linux-produce.outputs.artifact-id }}
          path: ${{ runner.temp }}/preview-download
      - name: Install and run only the matching package
        shell: bash
        run: |
          /usr/bin/python3 "$RUNNER_TEMP/preview-download/check_preview_install.py" \
            --archive "$RUNNER_TEMP/preview-download/"*.tar.gz \
            --sha256 "$RUNNER_TEMP/preview-download/"*.sha256 \
            --evidence "$RUNNER_TEMP/preview-consumer-evidence" \
            --work-parent "$RUNNER_TEMP" --prepare-dependencies
      - name: Preserve installation and command evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-linux-consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-consumer-evidence
          if-no-files-found: error

  ci-passed:
    name: CI Passed
    needs: [changes, rust-size, dependencies, docs, editors, fmt, clippy, test, preview-macos-produce, preview-linux-produce, preview-macos-consume, preview-linux-consume]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required jobs and legitimate skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
