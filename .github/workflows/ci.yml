name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'scripts/**'
              - '*.md'
              - 'LICENSE'
            rust:
              - 'crates/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'crates/lang-frontend/**'
              - 'crates/lang-std/**'
            codegen:
              - 'crates/lang-codegen/**'

  docs:
    name: Docs & Spec Structural Gate
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run check_docs.py
        run: python3 scripts/check_docs.py
      - name: Check git diff whitespace
        run: git diff --check

  fmt:
    name: Rust Code Formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Workspace Check & Clippy
    needs: [changes, docs, fmt]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      (needs.docs.result == 'success' || needs.docs.result == 'skipped') &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: brew install llvm@21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo Check
        env:
          LLVM_SYS_211_PREFIX: /opt/homebrew/opt/llvm@21
        run: cargo check --workspace --all-targets
      - name: Cargo Clippy
        env:
          LLVM_SYS_211_PREFIX: /opt/homebrew/opt/llvm@21
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Targeted Tests
    needs: [changes, clippy]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') &&
      needs.clippy.result == 'success'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 21
        run: brew install llvm@21
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@v2
      - name: Run Core & Targeted Tests
        env:
          LLVM_SYS_211_PREFIX: /opt/homebrew/opt/llvm@21
        run: |
          cargo test -p lang-frontend --lib
          cargo test -p lang-codegen
          cargo test -p lang-cli
          cargo test -p lang-lsp

  ci-passed:
    name: CI Passed
    needs: [docs, fmt, clippy, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded or were legitimately skipped
        run: |
          python3 -c "
          results = {
              'docs': '${{ needs.docs.result }}',
              'fmt': '${{ needs.fmt.result }}',
              'clippy': '${{ needs.clippy.result }}',
              'test': '${{ needs.test.result }}'
          }
          for job, res in results.items():
              if res not in ('success', 'skipped'):
                  print(f'Job {job} failed with status: {res}')
                  exit(1)
          print('All jobs succeeded or appropriately skipped!')
          "
