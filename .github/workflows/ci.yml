name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect Changed Files
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      codegen: ${{ steps.filter.outputs.codegen }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'scripts/**'
              - '*.md'
              - 'LICENSE'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-llvm/**'
            rust:
              - 'crates/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-llvm/**'
              - 'editors/**'
              - 'docs/tutorials/**'
              - 'scripts/check_tutorial.py'
              - 'scripts/check_core.sh'
              - 'scripts/check_integration.sh'
              - 'scripts/check_stage_integration.sh'
              - 'scripts/check_guide_litmus.sh'
              - 'scripts/install_ci_llvm.sh'
              - 'scripts/check_ci_results.py'
              - 'scripts/rust_test_artifact.rs'
              - 'scripts/tests/test_check_ci_results.py'
              - 'docs/guide/10-ownership-borrowing-drop.md'
              - 'docs/guide/11-copyability-layout-construction.md'
              - 'docs/guide/13-program-runtime-standard-library.md'
              - 'docs/guide/15-conformance-and-staging.md'
            frontend:
              - 'crates/lang-frontend/**'
              - 'crates/lang-std/**'
            codegen:
              - 'crates/lang-codegen/**'

  rust-size:
    name: Rust Physical Line Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Inspect the exact PR head, not GitHub's synthetic merge tree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test Rust size policy
        run: python3 -m unittest discover -s scripts/tests -p test_check_rust_sizes.py -v
      - name: Check handwritten Rust size growth
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base=origin/main; fi
          # Full history normally has the base; a force-push may need its exact SHA.
          if ! git cat-file -e "$base^{commit}"; then git fetch --no-tags origin "$base"; fi
          python3 scripts/check_rust_sizes.py --base "$base"

  dependencies:
    name: Direct Workspace Dependency Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - name: Verify direct workspace declarations
        run: python3 scripts/check_workspace_dependencies.py


  docs:
    name: Docs & Spec Structural Gate
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run check_docs.py
        run: python3 scripts/check_docs.py
      - name: Test docs and CI gate policies
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check git diff whitespace
        run: git diff --check

  fmt:
    name: Rust Code Formatting
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Workspace Check & Clippy (${{ matrix.os }})
    needs: [changes, docs, fmt]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (needs.docs.result == 'success' || needs.docs.result == 'skipped') &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM 21
        id: llvm
        uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ runner.arch }}-rust-1.96.0-llvm-${{ steps.llvm.outputs.version }}-${{ hashFiles('Cargo.lock', 'scripts/install_ci_llvm.sh', '.github/actions/setup-llvm/action.yml') }}
      - name: Cargo Check
        run: cargo check --locked --workspace --all-targets
      - name: Cargo Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Targeted Tests (${{ matrix.os }})
    needs: [changes, clippy]
    if: |
      always() &&
      (needs.changes.outputs.rust == 'true' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.clippy.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up LLVM 21
        id: llvm
        uses: ./.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-${{ runner.arch }}-rust-1.96.0-llvm-${{ steps.llvm.outputs.version }}-${{ hashFiles('Cargo.lock', 'scripts/install_ci_llvm.sh', '.github/actions/setup-llvm/action.yml') }}
      - name: Run bounded composition including tutorial
        run: bash scripts/check_integration.sh

  ci-passed:
    name: CI Passed
    needs: [changes, rust-size, dependencies, docs, fmt, clippy, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required jobs and legitimate skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
