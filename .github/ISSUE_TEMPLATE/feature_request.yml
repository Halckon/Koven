name: Feature / Spec Proposal
description: Suggest an idea or propose a new language feature / compiler capability
title: "[Proposal]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Please refer to [docs/guide/README.md](https://github.com/Halckon/koven/blob/main/docs/guide/README.md) to understand current language semantics before proposing changes.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution or Syntax
      description: Describe the syntax, behavior, or semantics you would like to see.
      render: kotlin
    validations:
      required: true
  - type: textarea
    id: phase_impact
    attributes:
      label: Phase & Layer Impact
      description: Which Phase (0-6) or compiler component would be affected by this proposal?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
