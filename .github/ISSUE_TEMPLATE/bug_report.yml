name: Bug Report
description: File a bug report for a compiler crash, incorrect diagnostic, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Minimal `.ko` code snippet that triggers the bug.
      render: kotlin
      placeholder: |
        fun main(): Unit {
            // code here
        }
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Provide platform and compiler version details.
      value: |
        - OS & Architecture (e.g. macOS 14 / Apple Silicon):
        - Rustc Version (`rustc --version`):
        - LLVM Version (`llvm-config --version`):
        - Koven Commit / Version (`kovenc --version` or git commit hash):
    validations:
      required: true
